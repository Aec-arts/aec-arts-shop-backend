
name = "aec-arts-shop"
main = "src/index.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "aec-arts-shop-orders"
database_id = "aa4f0bbe-6031-4a19-83e5-3b50a51b4548"
migrations_dir = "migrations"

[vars]
# Live checkout stays disabled until the owner explicitly confirms delivery policy.
DELIVERY_AMOUNT_PENCE = "0"
DELIVERY_CONFIGURED = "no"
PAYMENT_MODE = "test"
OWNER_EMAIL = "doctor-orgone@hotmail.com"
EMAIL_MODE = "queue_only"
